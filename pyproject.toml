[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag_intent_classifier"
version = "1.0.5"
description = "MiniLM-based intent classifier with 156 intents, including follow-up, negative sentiment, escalate intents detection for RAG systems. Python 3.9-3.12 recommended; Python 3.13 not currently targeted."
readme = "README.md"
requires-python = ">=3.9,<3.13"
authors = [
  { name = "Yuvaraj Dasarathan" }
]

dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.2",
  "scikit-learn==1.5.0",
  "joblib==1.4.2",
  "sentence-transformers==2.6.0; python_version<'3.13'",
  "transformers==4.41.2; python_version<'3.13'",
  "torch==2.2.2; python_version<'3.13'"
]

[project.scripts]
rag_intent_classifier = "rag_intent_classifier.infer:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["rag_intent_classifier*"]

[tool.setuptools.package-data]
rag_intent_classifier = [
    "docs/*.md",
    "models/*.joblib"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/yuvarajd2588/rag_intent_classifier"
